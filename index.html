<!doctype html>
<html lang="bn" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="google" content="notranslate" />

    <!-- Primary SEO -->
    <title>Booklover | Online Bookshop Bangladesh</title>
    <meta name="description" content="Browse books, explore collections and find your next favourite read at Booklover Bangladesh.">
    <meta name="keywords" content="Booklover, books Bangladesh, online bookshop" />
    <meta name="author" content="Booklover" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large" />
    <meta name="geo.region" content="BD" />
    <meta name="geo.placename" content="Dhaka, Bangladesh" />
    <meta name="language" content="bn" />
    <meta name="revisit-after" content="3 days" />
    <!-- Per-route canonical is emitted by SEOHead (react-helmet-async).
         Static canonical intentionally omitted here — <link rel="canonical">
         does not dedupe in Helmet, so a static one would ship alongside the
         per-route one and point every page at the homepage. -->


    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Booklover" />
    <meta property="og:title" content="Booklover | Online Bookshop Bangladesh" />
    <meta property="og:description" content="Browse books, explore collections and find your next favourite read at Booklover Bangladesh." />
    <meta property="og:url" content="https://booklover.com.bd" />
    <meta property="og:locale" content="bn_BD" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Booklover | Online Bookshop Bangladesh" />
    <meta name="twitter:description" content="Browse books, explore collections and find your next favourite read at Booklover Bangladesh." />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.png" type="image/png" />

    <!-- Web App Manifest (installable) -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="alternate" type="application/rss+xml" title="Booklover – Blog Feed" href="/rss.xml" />
    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Booklover" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- ============================================================
         PERFORMANCE: Critical resource hints (reduces FCP by ~800ms)
    ============================================================ -->
    <!-- 1. Preconnect to external origins ASAP -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://tzkmjdcpgkbztxlchdpu.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://tzkmjdcpgkbztxlchdpu.supabase.co" />
    <link rel="preconnect" href="https://connect.facebook.net" />
    <link rel="dns-prefetch" href="https://connect.facebook.net" />

    <!-- 1b. Module preload — warm critical app chunks during initial parse
         Browser will fetch + parse these in parallel with HTML, saving 200-500ms
         on first navigation -->
    <link rel="modulepreload" href="/src/main.tsx" />
    <link rel="modulepreload" href="/src/App.tsx" />
    <link rel="modulepreload" href="/src/components/booklover/Home.tsx" />

    <!-- 2. Non-render-blocking font load (print→all trick eliminates render-blocking) -->
    <link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800;900&family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Assistant:wght@400;600;700&display=swap" />
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800;900&family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Assistant:wght@400;600;700&display=swap"
      media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800;900&family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Assistant:wght@400;600;700&display=swap" />
    </noscript>

    <!-- Design copyright signal — visible to AI crawlers reading the HTML -->
    <meta name="copyright" content="© Booklover — Proprietary design. Automated scraping & UI cloning prohibited." />
    <meta name="rights" content="All visual designs, layouts and component styles are proprietary and protected." />
    <meta name="ai-content-declaration" content="no-clone, no-design-copy, content-may-be-cited-with-attribution" />

    <!-- 3. Critical inline CSS: prevent FOUC before React hydrates -->
    <style>
      html { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      body {
        background: #ffffff; margin: 0;
        /* Design protection — block selection on chrome/UI by default */
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* Allow selection ONLY in readable content + form fields */
      input, textarea, select, [contenteditable="true"],
      .allow-select, .allow-copy, .prose, .prose *,
      .product-description, .product-description *,
      .blog-content, .blog-content *,
      [data-allow-select="true"], [data-allow-select="true"] * {
        -webkit-user-select: text;
        -ms-user-select: text;
        user-select: text;
        -webkit-touch-callout: default;
      }
      img, video { -webkit-user-drag: none; -khtml-user-drag: none; user-drag: none; }
      @media print { body { display: none !important; }
        body::after { content: '© Booklover — Printing protected.'; display: block !important; }
      }

      /* Branded loader */
      #root:empty { display: flex; align-items: center; justify-content: center; min-height: 100vh; min-height: 100dvh; }
      #root:empty::before {
        content: '';
        display: block;
        width: 48px; height: 48px;
        background: url('/pwa-512.png') center/contain no-repeat;
        border-radius: 12px;
        animation: loader-breathe 1.6s ease-in-out infinite;
        filter: drop-shadow(0 0 12px rgba(124,58,237,0.3));
      }
      #root:empty::after {
        content: '';
        position: absolute;
        width: 64px; height: 64px;
        border: 2px solid transparent;
        border-top-color: #7c3aed;
        border-right-color: rgba(234,179,8,0.4);
        border-radius: 50%;
        animation: loader-orbit 1.2s linear infinite;
      }
      @keyframes loader-breathe {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.08); opacity: 1; }
      }
      @keyframes loader-orbit { to { transform: rotate(360deg); } }
    </style>

    <!-- Structured Data: Organization + WebSite (Google Rich Results) -->
    

    <!-- Structured Data: FAQPage — powers Google AI Overview, ChatGPT search, Perplexity answers -->
    

    <!-- Structured Data: Speakable — for voice / AI assistants -->
    

    <!-- AI / LLM crawler discoverability -->
    <link rel="alternate" type="text/markdown" title="LLM-friendly index" href="/llms.txt" />
    <link rel="alternate" type="text/markdown" title="LLM-friendly full content" href="/llms-full.txt" />

<script type="application/ld+json">{"@context": "https://schema.org", "@graph": [{"@type": "Organization", "name": "Booklover", "url": "https://booklover.com.bd", "logo": "https://booklover.com.bd/logo.png"}, {"@type": "WebSite", "name": "Booklover", "url": "https://booklover.com.bd", "potentialAction": {"@type": "SearchAction", "target": "https://booklover.com.bd/search?q={search_term_string}", "query-input": "required name=search_term_string"}}]}</script>
</head>

  <body>
    <div id="root"></div>
    <noscript><h1>Booklover</h1><p>Browse books and collections.</p><a href="/shop">All Books</a></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
