        /* Design protection — block selection on chrome/UI by default */
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* Allow selection ONLY in readable content + form fields */
      input, textarea, select, [contenteditable="true"],
      .allow-select, .allow-copy, .prose, .prose *,
      .product-description, .product-description *,
      .blog-content, .blog-content *,
      [data-allow-select="true"], [data-allow-select="true"] * {
        -webkit-user-select: text;
        -ms-user-select: text;
        user-select: text;
        -webkit-touch-callout: default;
      }
      img, video { -webkit-user-drag: none; -khtml-user-drag: none; user-drag: none; }
      @media print { body { display: none !important; }
        body::after { content: '© Booklover — Printing protected.'; display: block !important; }
      }

      /* Branded loader */
      #root:empty { display: flex; align-items: center; justify-content: center; min-height: 100vh; min-height: 100dvh; }
      #root:empty::before {
        content: '';
        display: block;
        width: 48px; height: 48px;
        background: url('/pwa-512.png') center/contain no-repeat;
        border-radius: 12px;
        animation: loader-breathe 1.6s ease-in-out infinite;
        filter: drop-shadow(0 0 12px rgba(124,58,237,0.3));
      }
      #root:empty::after {
        content: '';
        position: absolute;
        width: 64px; height: 64px;
        border: 2px solid transparent;
        border-top-color: #7c3aed;
        border-right-color: rgba(234,179,8,0.4);
        border-radius: 50%;
        animation: loader-orbit 1.2s linear infinite;
      }
      @keyframes loader-breathe {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.08); opacity: 1; }
      }
      @keyframes loader-orbit { to { transform: rotate(360deg); } }
    </style>
